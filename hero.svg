<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="800" height="210" role="img" aria-label="Dewashish Lambore: Founder at Yap, Founding Engineer at Astrowithin, AI Research at SCAAI">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .role { opacity: 0; animation: role 12s infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
    @keyframes role {
      0% { opacity: 0; transform: translateY(6px); }
      3%, 22% { opacity: 1; transform: translateY(0); }
      25%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .type { animation: type 1.2s steps(8) forwards; }
    @keyframes type { from { width: 0; } to { width: 90px; } }
  </style>
  <rect width="800" height="210" rx="14" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="799" height="209" rx="13.5" fill="none" stroke="#30363D"/>
  <circle cx="24" cy="22" r="6" fill="#FF5F57"/>
  <circle cx="44" cy="22" r="6" fill="#FEBC2E"/>
  <circle cx="64" cy="22" r="6" fill="#28C840"/>

  <clipPath id="typed"><rect class="type" x="32" y="48" height="26" width="0"/></clipPath>
  <text x="32" y="67" class="mono" font-size="17" fill="#7EE787" clip-path="url(#typed)">$ whoami</text>

  <text x="32" y="112" class="mono" font-size="34" font-weight="700" fill="#F0F6FC">Dewashish Lambore</text>

  <g class="mono" font-size="18" fill="#D2E823">
    <text x="32" y="150" class="role">&gt; Founder @ Yap</text>
    <text x="32" y="150" class="role r2">&gt; Founding Engineer @ Astrowithin</text>
    <text x="32" y="150" class="role r3">&gt; AI Research @ SCAAI</text>
    <text x="32" y="150" class="role r4">&gt; Published @ IEEE IRAI 2026</text>
  </g>

  <text x="32" y="185" class="mono" font-size="14" fill="#8B949E">AI engineer · researcher · builder · Pune, India<tspan class="cursor" fill="#F0F6FC"> ▍</tspan></text>
</svg>
